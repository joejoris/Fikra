# Render blueprint: one Node web service (static site + API on one origin).
# The database is Supabase Postgres (free tier): create a project at
# https://supabase.com, copy its connection string (Settings → Database), and
# paste it as DATABASE_URL in the dashboard (or via `render envs`). Apply this
# file via the Render dashboard (New → Blueprint) pointing at this repo.
#
# Secrets marked `sync: false` must be set in the dashboard. Values mirror
# .env.example.

services:
  - type: web
    name: fikra
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: INBOX_PASSWORD
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_MODE
        value: sandbox
