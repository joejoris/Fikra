# Cloudflare Pages configuration.
#
# `wrangler pages dev dist` uses this file to emulate the deployed environment,
# including the D1 and R2 bindings below. For a real deployment, either set these
# in the Cloudflare dashboard (Settings → Functions) or uncomment and fill them in.

name = "fikra"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

# Submissions inbox database (see schema/submissions.sql).
# The ID below is a local-only placeholder so `wrangler pages dev` and
# `wrangler d1 execute --local` work without logging in. After `wrangler login`,
# run `npx wrangler d1 create fikra-submissions` and replace database_id with
# the real one (for both local `.dev.vars`-style work and production).
[[d1_databases]]
binding = "DB"
database_name = "fikra-submissions"
database_id = "4074ad54-5ccc-4319-8f65-2a5fa0b4776c"

# Uploaded CVs / pitch decks (optional — without it, files are emailed instead).
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "fikra-uploads"
