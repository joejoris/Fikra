backend:
  name: github
  repo: joejoris/Fikra
  branch: main
  # Enables editing on your own machine with `npm run cms`.
  local_backend: true

# `local_backend: true` is ignored in production. To let staff edit in the
# browser, FIKRA must set up GitHub OAuth or an auth proxy. See
# docs/admin-guide.md for the options and steps.

media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

site_url: https://fikra.example.org
display_url: https://fikra.example.org
logo_url: /favicon.svg

collections:
  - name: news
    label: News
    label_singular: News post
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{pubDate | date("DD MMM YYYY")}}'
    sortable_fields: [pubDate, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short description, widget: text, hint: 'One line, shown in lists.' }
      - { name: pubDate, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: author, label: Author, widget: string, default: FIKRA }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }

  - name: programs
    label: Programs
    label_singular: Program
    folder: src/content/programs
    create: true
    extension: md
    format: frontmatter
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: audience, label: Who it is for, widget: string }
      - name: status
        label: Status
        widget: select
        options:
          - { label: Applications open, value: open }
          - { label: Coming soon, value: coming-soon }
          - { label: Closed, value: closed }
        default: coming-soon
      - { name: duration, label: Duration, widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: body, label: Details, widget: markdown }

  - name: impact
    label: Impact stories
    label_singular: Impact story
    folder: src/content/impact
    create: true
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: person, label: Person, widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: date, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: true }
      - { name: body, label: Story, widget: markdown }

  - name: team
    label: Team
    label_singular: Team member
    folder: src/content/team
    create: true
    extension: md
    format: frontmatter
    summary: '{{name}} — {{role}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: bio, label: Short bio, widget: text }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: photo, label: Photo, widget: image, required: false }
      - { name: photoPosition, label: Photo focus point, widget: string, required: false, hint: 'Where to centre the crop, e.g. top or center 40%. Leave empty for top.' }
      - { name: email, label: Email, widget: string, required: false }

  - name: faq
    label: FAQ
    label_singular: FAQ entry
    folder: src/content/faq
    create: true
    extension: md
    format: frontmatter
    summary: '{{question}}'
    sortable_fields: [order, question]
    fields:
      - { name: question, label: Question, widget: string }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: false }
      - { name: body, label: Answer, widget: markdown }

  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    create: true
    extension: md
    format: frontmatter
    summary: '{{title}} — {{startDate | date("DD MMM YYYY")}}'
    sortable_fields: [startDate, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Short description, widget: text }
      - { name: startDate, label: Start date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: endDate, label: End date (optional), widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false, picker_utc: true }
      - { name: startTime, label: Start time (optional), widget: string, required: false, hint: 'e.g. 17:00' }
      - { name: location, label: Location, widget: string, required: false }
      - { name: registrationUrl, label: Registration link, widget: string, required: false, hint: 'Leave empty to use the built-in RSVP form on the events page instead.' }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: true }
      - { name: body, label: Details, widget: markdown }

  - name: documents
    label: Documents
    label_singular: Document
    folder: src/content/documents
    create: true
    extension: md
    format: frontmatter
    media_folder: 'public/documents'
    public_folder: '/documents'
    summary: '{{title}}'
    sortable_fields: [category, order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: category
        label: Category
        widget: select
        options: [Governance, Reports, Policies, Other]
        default: Governance
      - { name: file, label: Document file, widget: file }
      - name: fileType
        label: File type
        widget: select
        options: [PDF, DOCX, XLSX]
        default: PDF
      - { name: size, label: File size, widget: string, required: false, hint: 'e.g. 1.2 MB' }
      - { name: date, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: true }
      - { name: body, label: Notes, widget: markdown, required: false }

  - name: newsletters
    label: Newsletter editions
    label_singular: Newsletter edition
    folder: src/content/newsletters
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{pubDate | date("DD MMM YYYY")}}'
    sortable_fields: [pubDate, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text, hint: 'One line, shown in the archive list.' }
      - { name: pubDate, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: true }
      - { name: body, label: Edition content, widget: markdown }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: src/content/testimonials
    create: true
    extension: md
    format: frontmatter
    summary: '{{name}} — {{role}}'
    sortable_fields: [order, name]
    fields:
      - { name: quote, label: Quote, widget: text }
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string, hint: 'e.g. Founder, programme graduate, mentor' }
      - { name: location, label: Location, widget: string, required: false }
      - { name: order, label: Sort order, widget: number, default: 99, value_type: int }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: true }
      - { name: body, label: Notes (not shown on the site), widget: markdown, required: false }
